[package]
name = "ps-tile-installer"
version = "0.1.0"
edition = "2024"
publish = false

# Independent installer; never part of the main application's default build.
[workspace]

[dependencies]
eframe = "0.31"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winres = "0.1"
