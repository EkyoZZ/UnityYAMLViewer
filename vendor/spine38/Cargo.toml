[package]
name = "rusty_spine"
version = "0.3.1"
edition = "2021"
license-file = "LICENSE"

[dependencies]
mint = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = ["draw_functions", "mint"]
draw_functions = []
mint = ["dep:mint"]
use_libc = ["libc"]
libc = ["dep:libc"]
egui_debugger = []
