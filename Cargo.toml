[package]
name = "unity_yaml_viewer"
version = "1.1.4"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp"] }
eframe = "0.31"
ab_glyph = "0.2"
egui_extras = { version = "0.31", default-features = false, features = ["svg", "syntect"] }
rfd = "0.15"
regex = "1.11"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
ico = "0.4"
image = "0.25"
winres = "0.1"
