[package]
name = "unity_yaml_viewer"
version = "1.3.4"
edition = "2024"

[dependencies]
rodio = { version = "0.20", default-features = false }
ufbx = "0.11.5"
spine38 = { package = "rusty_spine", path = "vendor/spine38" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp", "ico"] }
eframe = "0.31"
arboard = { version = "3.6", default-features = false }
raw-window-handle = "0.6"
libloading = "0.8"
resvg = { version = "0.37", default-features = false, features = ["text", "system-fonts"] }
ab_glyph = "0.2"
egui_extras = { version = "0.31", default-features = false, features = ["svg", "syntect", "image"] }
rfd = "0.15"
regex = "1.11"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
calamine = { version = "0.37", default-features = false }
quick-xml = "0.42"

egui_commonmark = { path = "vendor/egui_commonmark", version = "=0.20.0", default-features = false, features = ["pulldown_cmark", "svg", "better_syntax_highlighting"] }
pulldown-cmark = { version = "0.12", default-features = false }

tokio = { version = "1", features = ["rt", "time"] }

png = "0.18"

[build-dependencies]
ico = "0.4"
image = "0.25"
winres = "0.1"
